name: Rust

on:
  push:
    branches: [main, rewrite/gpui, feat/ghostty-terminal]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, pinned 2026-09-03
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Prepare pinned Ghostty and Zig
        run: |
          ./Scripts/fetch_ghostty.sh aarch64
          ./Scripts/fetch_ghostty.sh x86_64

      - name: Test Ghostty backend
        run: cargo test --locked --features ghostty

      - name: Verify
        run: ./Scripts/verify.sh

      - name: Package development bundle
        run: ./Scripts/package_app.sh debug --universal --ghostty --sign -
