# Set app to the unique name you create in your own Fly.io organization.
app = "CHANGE-ME-vibra-relay"
primary_region = "gru"
[build]
  dockerfile = "services/relay/Dockerfile"
[env]
  VIBRA_RELAY_BIND = "0.0.0.0:8787"
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
