<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibra — la terminal que necesitas para vibe coding</title>
<meta name="description" content="La terminal que necesitas para vibe coding. App nativa para macOS: terminales, proyectos y agentes en un solo lugar.">
<meta name="theme-color" content="#050505">
<meta property="og:title" content="Vibra">
<meta property="og:description" content="La terminal que necesitas para vibe coding.">
<meta property="og:image" content="hero.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #050505;
    --fg: #efece4;
    --muted: rgba(239, 236, 228, 0.58);
    --faint: rgba(239, 236, 228, 0.28);
    --cream: #efe8dc;
    --cream-fg: #11100c;
    --glow-warm: rgba(214, 154, 82, 0.2);
    --glow-cool: rgba(88, 148, 196, 0.14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 "Instrument Sans", ui-sans-serif, -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }

  .atmosphere {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .atmosphere .photo,
  .atmosphere .photo-blur {
    position: absolute;
    left: 50%;
    top: 1.4rem;
    width: min(900px, 80vw);
    height: auto;
    transform: translateX(-50%);
    object-fit: contain;
  }
  .atmosphere .photo-blur {
    width: min(1080px, 92vw);
    top: 0;
    opacity: 0.75;
    filter: blur(36px) saturate(1.08);
    -webkit-mask-image: radial-gradient(ellipse 68% 64% at 50% 42%, #000 8%, transparent 74%);
    mask-image: radial-gradient(ellipse 68% 64% at 50% 42%, #000 8%, transparent 74%);
  }
  .atmosphere .photo {
    -webkit-mask-image:
      radial-gradient(ellipse 56% 58% at 50% 42%, #000 12%, rgba(0, 0, 0, 0.55) 38%, transparent 72%),
      linear-gradient(to bottom, transparent 0%, #000 10%, #000 58%, transparent 90%);
    mask-image:
      radial-gradient(ellipse 56% 58% at 50% 42%, #000 12%, rgba(0, 0, 0, 0.55) 38%, transparent 72%),
      linear-gradient(to bottom, transparent 0%, #000 10%, #000 58%, transparent 90%);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }
  .atmosphere .wash {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 38% 30% at 50% 30%, var(--glow-cool), transparent 72%),
      radial-gradient(ellipse 30% 24% at 48% 44%, var(--glow-warm), transparent 74%),
      linear-gradient(to bottom, transparent 0%, transparent 56%, rgba(5, 5, 5, 0.5) 76%, var(--bg) 90%);
  }
  .glyph {
    position: absolute;
    color: rgba(232, 210, 168, 0.22);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    user-select: none;
  }
  .g1 { top: 18%; left: 12%; }
  .g2 { top: 34%; right: 14%; }
  .g3 { top: 52%; left: 18%; }
  .g4 { top: 26%; right: 22%; }
  .g5 { top: 62%; right: 16%; }

  header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.15rem 1.5rem;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    color: inherit;
    text-decoration: none;
    font-weight: 560;
    letter-spacing: -0.02em;
  }
  .brand img {
    width: 26px;
    height: 26px;
    border-radius: 6px;
  }
  .nav-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.92rem;
    transition: color 0.15s ease;
  }
  .nav-link:hover { color: var(--fg); }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding: 0 1.4rem 7.5rem;
  }

  h1 {
    margin: 0;
    font-family: "Instrument Serif", "Iowan Old Style", Palatino, Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.8rem, 8vw, 5.15rem);
    line-height: 0.98;
    letter-spacing: -0.025em;
  }
  .lede {
    margin: 1.15rem 0 0;
    max-width: 28rem;
    color: var(--muted);
    font-size: 1.05rem;
    font-weight: 400;
  }

  .cta {
    margin-top: 2.15rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.85rem;
  }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 13.5rem;
    background: var(--cream);
    color: var(--cream-fg);
    text-decoration: none;
    font-weight: 560;
    font-size: 0.98rem;
    letter-spacing: -0.01em;
    padding: 0.92rem 1.7rem;
    border-radius: 999px;
    transition: transform 0.18s ease, background 0.18s ease;
  }
  .button:hover {
    background: #f6f1e8;
    transform: translateY(-1px);
  }
  .meta {
    color: var(--faint);
    font-size: 0.82rem;
    letter-spacing: 0.01em;
  }

  footer {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    gap: 1.1rem;
    padding: 1.3rem 1.4rem 1.5rem;
    color: var(--faint);
    font-size: 0.8rem;
  }
  footer a {
    color: inherit;
    text-decoration: none;
  }
  footer a:hover { color: var(--muted); }

  @media (max-width: 640px) {
    header { padding: 1rem 1.1rem; }
    main { padding: 0 1.15rem 6.4rem; }
    .atmosphere .photo {
      width: min(640px, 90vw);
      top: 3rem;
    }
    .atmosphere .photo-blur {
      width: min(780px, 104vw);
      top: 1.6rem;
    }
    .glyph { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .button { transition: none; }
    .button:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="atmosphere" aria-hidden="true">
      <img class="photo-blur" src="hero.jpg" alt="" width="1536" height="1024">
      <img class="photo" src="hero.jpg" alt="" width="1536" height="1024">
      <div class="wash"></div>
      <span class="glyph g1">+</span>
      <span class="glyph g2">×</span>
      <span class="glyph g3">=</span>
      <span class="glyph g4">+</span>
      <span class="glyph g5">×</span>
    </div>

    <header>
      <a class="brand" href="./">
        <img src="icon.png" alt="">
        Vibra
      </a>
      <a class="nav-link" href="https://github.com/rubenrca/Vibra">GitHub</a>
    </header>

    <main>
      <h1>La terminal que necesitas<br>para vibe coding.</h1>
      <p class="lede">App nativa para macOS. Terminales, proyectos y agentes, en un solo lugar.</p>
      <div class="cta">
        <a class="button" id="download" href="https://github.com/rubenrca/Vibra/releases/latest">Download for macOS</a>
        <span class="meta" id="meta">Universal · macOS 14+ · Signed &amp; notarized</span>
      </div>
    </main>

    <footer>
      <span>MIT</span>
      <a href="https://github.com/rubenrca/Vibra">Source</a>
      <a href="https://github.com/rubenrca/Vibra/releases">Releases</a>
    </footer>
  </div>

<script>
// The appcast is the single source of truth for what the current release is, so
// the page reads it instead of carrying a version number that goes stale.
fetch('appcast.xml', { cache: 'no-cache' })
  .then(function (response) {
    if (!response.ok) throw new Error(response.status);
    return response.text();
  })
  .then(function (text) {
    var feed = new DOMParser().parseFromString(text, 'application/xml');
    var item = feed.querySelector('item');
    var enclosure = item && item.querySelector('enclosure');
    if (!enclosure) throw new Error('no enclosure');

    // generate_appcast writes shortVersionString as a child element of the
    // item, and falls back to titling the item with the version itself.
    var sparkleNS = 'http://www.andymatuschak.org/xml-namespaces/sparkle';
    var shortVersion = item.getElementsByTagNameNS(sparkleNS, 'shortVersionString')[0];
    var title = item.querySelector('title');
    var version = (shortVersion && shortVersion.textContent.trim()) ||
      (title && title.textContent.trim().replace(/^Vibra\s*/, '')) || '';

    var url = enclosure.getAttribute('url');
    var length = parseInt(enclosure.getAttribute('length'), 10);

    document.getElementById('download').href = url;
    document.getElementById('download').textContent =
      version ? 'Download Vibra ' + version : 'Download Vibra';

    var size = length ? ' · ' + (length / 1048576).toFixed(1) + ' MB' : '';
    document.getElementById('meta').textContent =
      'Universal · macOS 14+ · Signed & notarized' + size;
  })
  .catch(function () {
    // Leave the link pointing at the releases page: still correct, just less direct.
  });
</script>
</body>
</html>
