[package]
name = "vibra"
version = "0.3.29"
edition = "2024"
rust-version = "1.96"
publish = false

[build-dependencies]
cc = "1.2"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
async-channel = "2.5"
notify = "8"
directories = "6.0"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.24", features = ["serde", "v4"] }

raw-window-handle = "0.6"

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }

# GPUI 0.2.2 adds alpha values in its Metal renderer, making layered surfaces
# opaque. Keep the source-over correction reproducible in builds and releases.
[patch.crates-io]
gpui = { path = "third_party/gpui" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
