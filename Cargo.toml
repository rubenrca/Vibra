[package]
name = "vibra"
version = "0.3.17"
edition = "2024"
rust-version = "1.96"
publish = false

[build-dependencies]
cc = "1.2"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
async-channel = "2.5"
directories = "6.0"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["serde", "v4"] }

vibra-remote = { path = "services/remote" }
security-framework = "3"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
