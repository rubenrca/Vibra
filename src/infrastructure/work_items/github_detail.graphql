query($id: ID!) {
  node(id: $id) {
    ... on Issue {
      body
      comments(last: 40) {
        totalCount
        nodes {
          id
          body
          createdAt
          url
          isMinimized
          author { login }
        }
      }
    }
    ... on PullRequest {
      body
      baseRefName
      headRefName
      headRefOid
      reviewDecision
      mergeable
      mergeStateStatus
      isCrossRepository
      viewerCanUpdateBranch
      viewerCanEnableAutoMerge
      viewerCanDisableAutoMerge
      viewerCanDeleteHeadRef
      autoMergeRequest { mergeMethod }
      headRef { id }
      headRepository { nameWithOwner }
      viewerLatestReview { commit { oid } }
      files(first: 100) {
        nodes { path viewerViewedState }
      }
      comments(last: 40) {
        totalCount
        nodes {
          id
          body
          createdAt
          url
          isMinimized
          author { login }
        }
      }
      reviews(last: 40) {
        totalCount
        nodes {
          id
          body
          submittedAt
          url
          state
          author { login }
        }
      }
      reviewThreads(last: 20) {
        totalCount
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          diffSide
          comments(first: 20) {
            totalCount
            nodes {
              id
              body
              createdAt
              url
              path
              line
              originalLine
              isMinimized
              author { login }
            }
          }
        }
      }
    }
  }
}
